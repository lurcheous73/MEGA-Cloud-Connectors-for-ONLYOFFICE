name: MEGA S4 - CommunityServer 12.8 compile

on:
  push:
    branches:
      - feature/mega-s4
    paths:
      - 'src/mega-s4/**'
      - 'patches/communityserver-12.8/mega-s4-provider-integration.patch'
      - '.github/workflows/mega-s4-communityserver-12.8.yml'
  pull_request:
    paths:
      - 'src/mega-s4/**'
      - 'patches/communityserver-12.8/mega-s4-provider-integration.patch'
      - '.github/workflows/mega-s4-communityserver-12.8.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout connector repository
        uses: actions/checkout@v4

      - name: Checkout exact ONLYOFFICE CommunityServer baseline
        uses: actions/checkout@v4
        with:
          repository: ONLYOFFICE/CommunityServer
          ref: fe1fa7babd093969e939ba6ff45a9fee1299dc93
          path: upstream

      - name: Install NuGet
        uses: NuGet/setup-nuget@v2

      - name: Install MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Stage MEGA S4 provider source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:GITHUB_WORKSPACE 'src/mega-s4/communityserver-12.8/MegaS4'
          $dst = Join-Path $env:GITHUB_WORKSPACE 'upstream/module/ASC.Files.Thirdparty/MegaS4'
          if (!(Test-Path $src)) { throw "MEGA S4 source directory missing: $src" }
          if (Test-Path $dst) { Remove-Item -Recurse -Force $dst }
          Copy-Item -Recurse -Force $src $dst
          Write-Host "Staged MEGA S4 source files:"
          Get-ChildItem $dst -File | Sort-Object Name | ForEach-Object { Write-Host "  $($_.Name)" }

      - name: Verify and apply exact upstream integration patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $patch = Join-Path $env:GITHUB_WORKSPACE 'patches/communityserver-12.8/mega-s4-provider-integration.patch'
          if (!(Test-Path $patch)) { throw "Integration patch missing: $patch" }
          Push-Location (Join-Path $env:GITHUB_WORKSPACE 'upstream')
          try {
            git apply --check --whitespace=error-all $patch
            git apply --whitespace=error-all $patch
            git diff --check
          }
          finally {
            Pop-Location
          }

      - name: Restore ASC.Files.Thirdparty dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location (Join-Path $env:GITHUB_WORKSPACE 'upstream')
          try {
            nuget restore 'module/ASC.Files.Thirdparty/ASC.Files.Thirdparty.csproj' -NonInteractive -Verbosity normal
          }
          finally {
            Pop-Location
          }

      - name: Compile ASC.Files.Thirdparty
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location (Join-Path $env:GITHUB_WORKSPACE 'upstream')
          try {
            msbuild 'module/ASC.Files.Thirdparty/ASC.Files.Thirdparty.csproj' /m /t:Build /p:Configuration=Release /p:Platform=AnyCPU /v:minimal
          }
          finally {
            Pop-Location
          }

      - name: Confirm compiled provider source is included
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = Get-Content (Join-Path $env:GITHUB_WORKSPACE 'upstream/module/ASC.Files.Thirdparty/ASC.Files.Thirdparty.csproj') -Raw
          $required = @(
            'MegaS4\\MegaS4Storage.cs',
            'MegaS4\\MegaS4FileDao.cs',
            'MegaS4\\MegaS4FolderDao.cs',
            'MegaS4\\MegaS4ProviderInfo.cs'
          )
          foreach ($item in $required) {
            if (!$project.Contains($item)) { throw "Project does not include $item" }
          }
          Write-Host 'PASS - MEGA S4 provider is present in the exact CommunityServer 12.8 build graph.'
